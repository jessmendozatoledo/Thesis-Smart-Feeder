<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Management</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/schedule.css">
</head>

<body>
    <nav>
        <a href="/">Home</a> |
        <a href="/module.html">Modules</a> |
        <a href="/schedule.html" class="active">Schedules</a> |
        <a href="/history.html">History</a> |
        <a href="/camera.html">Camera</a>
    </nav>

    <h1>Schedule Management</h1>

    <form id="addScheduleForm">
        <label>Module ID:</label>
        <input type="text" id="module_id" required><br>
        <label>Feed Date:</label>
        <input type="date" id="feed_date" required><br>
        <label>Feed Time:</label>
        <input type="time" id="feed_time" required><br>
        <label>Amount (g):</label>
        <input type="number" id="amount" required step="0.01"><br>
        <button type="button" onclick="addSchedule()">Add Schedule</button>
        <button type="button" onclick="addRecurringSchedule()">Add Recurring (7 days)</button>
    </form>

    <hr>

    <h2>Schedule List</h2>
    <table>
        <thead>
            <tr>
                <th>Schedule ID</th>
                <th>Module ID</th>
                <th>Feed Date</th>
                <th>Feed Time</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="scheduleTableBody">
            <tr>
                <td colspan="7">Loading...</td>
            </tr>
        </tbody>
    </table>

    <script src="/static/scripts/schedule.js"></script>
</body>

</html>
